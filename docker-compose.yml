name: praxis

# Full local stack (prd/16 §3). `make up` / `docker compose up -d`.
# Profiles: default = platform; `demo` adds a local Git server.

x-common-env: &common-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    # host 5433 → container 5432 (avoids a clash with a native Postgres on 5432)
    ports: ["5433:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-temporal:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes: ["pg-temporal-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres-temporal
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8088:8080"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: praxis
      MINIO_ROOT_PASSWORD: praxis-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 praxis praxis-secret &&
      mc mb -p local/praxis-artifacts || true &&
      echo 'bucket ready'"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-praxis-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports: ["4000:4000"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    # docker-out-of-docker for the `docker` sandbox backend (ADR-0005, local/demo only).
    # root + socket mount so it works regardless of the host's docker group GID.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      CORE_HTTP_PORT: "3000"
      API_PREFIX: /api/v1
      PRAXIS_PUBLIC_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-chars-min}
      DATABASE_URL: postgres://praxis:praxis@postgres:5432/praxis
      REDIS_URL: redis://redis:6379
      EVENT_BUS_DRIVER: redis-streams
      RUN_DRIVER: ${RUN_DRIVER:-inproc}
      TEMPORAL_ADDRESS: temporal:7233
      AGENT_RUNTIME_URL: http://agent:8081
      LITELLM_BASE_URL: http://litellm:4000
      S3_ENDPOINT: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SEED_DEMO: "true"
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
      SANDBOX_IMAGE: praxis/sandbox:local
      SANDBOX_DOCKER_NETWORK: bridge
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://praxis:praxis@postgres:5432/praxis
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-chars-min}
      SEED_DEMO: "true"
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@praxis.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-ChangeMe123!}
    command: ["/bin/sh", "-c", "node dist/database/run-migrations.js && node dist/database/run-seed.js"]
    restart: "no"

  agent:
    build:
      context: services/agent
    environment:
      <<: *common-env
      AGENT_HTTP_PORT: "8081"
      LITELLM_BASE_URL: http://litellm:4000
    ports: ["8081:8081"]

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      <<: *common-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: praxis-runs
      AGENT_RUNTIME_URL: http://agent:8081
      CORE_INTERNAL_URL: http://core:3000
    profiles: ["temporal"]

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
      args:
        # baked into the client bundle — the browser reaches core directly (CORS is open)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    depends_on: [core]
    ports: ["8080:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 10

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__server__HTTP_PORT: "3000"
    ports: ["3001:3000"]
    volumes: ["gitea-data:/data"]
    profiles: ["demo"]

volumes:
  pg-data:
  pg-temporal-data:
  redis-data:
  minio-data:
  gitea-data:
