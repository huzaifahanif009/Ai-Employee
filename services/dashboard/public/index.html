<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Praxis — Demo Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">◆ Praxis <span>demo console · Phase 1 / M1</span></div>
    <div id="conn" class="conn">○ offline</div>
  </header>

  <main>
    <section id="login-panel" class="card">
      <h2>Sign in</h2>
      <label>Email <input id="email" value="admin@praxis.local" /></label>
      <label>Password <input id="password" type="password" value="ChangeMe123!" /></label>
      <button id="login-btn">Sign in</button>
      <p class="muted">Seeded by <code>make migrate</code>. Or <a href="#" id="register-link">register a new tenant</a>.</p>
      <div id="login-err" class="err"></div>
    </section>

    <div id="app" hidden>
      <section class="card">
        <h2>Work items</h2>
        <div class="row">
          <select id="project-select"></select>
          <button id="refresh-wi">Refresh</button>
        </div>
        <table id="wi-table"><thead><tr><th>Title</th><th>State</th><th>Labels</th><th></th></tr></thead><tbody></tbody></table>
        <details>
          <summary>New work item</summary>
          <label>Title <input id="wi-title" placeholder="Add retry to notifications" /></label>
          <label>Body <textarea id="wi-body" rows="2"></textarea></label>
          <label>Acceptance criteria (one per line) <textarea id="wi-ac" rows="2"></textarea></label>
          <button id="wi-create">Create</button>
        </details>
      </section>

      <section class="card">
        <h2>Runs <span class="muted" id="fleet"></span></h2>
        <table id="runs-table"><thead><tr><th>Run</th><th>State</th><th>Cost</th><th>Tokens</th><th>Files</th><th>PR</th></tr></thead><tbody></tbody></table>
      </section>

      <section class="card wide" id="approvals-card">
        <h2>Approvals <span class="pill" id="approvals-count">0 open</span></h2>
        <div id="approvals-list" class="muted">No open approvals.</div>
      </section>

      <section class="card wide">
        <h2>Live activity <span class="muted" id="watching"></span></h2>
        <div class="row">
          <button id="pause-btn" disabled>Pause</button>
          <button id="resume-btn" disabled>Resume</button>
          <button id="cancel-btn" disabled>Cancel</button>
          <input id="comment-input" placeholder="inject a comment…" />
          <button id="comment-btn" disabled>Send</button>
        </div>
        <div id="activity" class="activity"></div>
      </section>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
